name: CI

# Har push va PR'da:
#  - backend regressiya testlari (pytest) + BAJARILISH isboti
#  - backend CHECK/sxema darvozasi haqiqiy PostgreSQL 18 da (production versiyasi)
#  - production o'rnatmasida tooling paketlari yo'qligi (Dockerfile'dagidek toza venv)
#  - frontend tip-tekshiruvi (tsc) — POS va Manager (electron app-ichi node_modules'дан).
#  - E2E (Playwright): robot POS+Manager'ni haqiqiy brauzerda bosib chiqadi
#    (toza SQLite seed + vite dev serverlar — playwright.config.ts webServer'lari).
#
# ⚠️  PHASE 4A.1: backend job 2026-09-11 dan 68f73ae gacha HAR commit'da «no tests ran»
#     bilan qizil edi (`tests/test_import_1c.py` -> pandas yo'q -> sys.exit -> INTERNALERROR)
#     va buni HECH KIM sezmadi. Endi exit kodiga ishonilmaydi: `verify_pytest_run.py`
#     junit va log bo'yicha testlar HAQIQATAN bajarilganini (har modul soni, skip siyosati)
#     isbotlaydi.
#
# `ci-proof/**` — faqat CI isboti uchun (salbiy nazorat branch'lari). Staging faqat
# `main` dan deploy bo'ladi, production'da avtomatik deploy YO'Q.

on:
  push:
    branches: [main, "ci-proof/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
        with:
          # `test_PG_da47aa8_*` eski commit'ni `git archive` qiladi — sayoz klonda u
          # SKIP bo'lardi va migratsiya isboti CI'da jimgina yo'qolardi.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # dev      — pytest, pgserver (cash/tenancy/PG testlari), pyyaml
          # import1c — pandas/xlrd/openpyxl: FAQAT tests/test_import_1c.py uchun.
          #            Production (Dockerfile `pip install -e .`) buni O'RNATMAYDI —
          #            prod-install-boundary job'i va tests/test_dependency_boundary.py.
          pip install -e ".[dev,import1c]"
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rfEs --durations=15 \
            --junitxml=pytest-junit.xml -o junit_family=xunit2 2>&1 | tee pytest-output.log
      - name: Verify tests actually EXECUTED (not just collected)
        if: always()
        run: |
          python ../../scripts/ci/verify_pytest_run.py \
            --junit pytest-junit.xml --tests tests --allow tests/ci_expected_skips.txt \
            --pytest-log pytest-output.log
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pytest-${{ github.run_id }}
          path: |
            apps/server/pytest-junit.xml
            apps/server/pytest-output.log
          retention-days: 30
          if-no-files-found: warn

  backend-pg18:
    name: Backend (PostgreSQL 18 schema gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Mahalliy va asosiy job'dagi Postgres testlari pgserver (PG16) da. Production va
    # staging esa PG 18 — `NOT ENFORCED` CHECK faqat PG18 da mavjud, ya'ni bu hujum
    # vektorini faqat shu yerda HAQIQATAN sinab bo'ladi.
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-ephemeral
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: apps/server
    env:
      SAVDOOS_TEST_PG_URL: postgresql://postgres:ci-only-ephemeral@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Server is PostgreSQL 18
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["SAVDOOS_TEST_PG_URL"]) as c:
              v = int(c.execute("SHOW server_version_num").fetchone()[0])
          print("server_version_num", v)
          assert v >= 180000, v
          PY
      - name: CHECK definition gate on PostgreSQL 18
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rfEs -k external \
            --junitxml=pytest-pg18.xml -o junit_family=xunit2 \
            tests/test_check_defs_pg.py 2>&1 | tee pytest-pg18.log
      - name: Verify every PG18 case EXECUTED (NOT ENFORCED detection included)
        if: always()
        run: |
          python - <<'PY'
          import ast, xml.etree.ElementTree as ET
          src = open("tests/test_check_defs_pg.py", encoding="utf-8").read()
          static = sorted(n.name for n in ast.parse(src).body
                          if isinstance(n, ast.FunctionDef) and n.name.startswith("test"))
          cases = {c.get("name"): c for c in ET.parse("pytest-pg18.xml").getroot().iter("testcase")}
          want = {f"{n}[external]" for n in static}
          assert set(cases) == want, f"PG18 testcase to'plami mos emas: {sorted(set(cases) ^ want)}"
          SKIP_OK = {"test_PG18_dan_OLDIN_NOT_ENFORCED_sintaksisi_RAD_etiladi[external]"}
          MUST = "test_PG_NOT_ENFORCED_cheklov_ANIQLANADI_va_ALMASHTIRILADI[external]"
          bad = []
          for name, c in sorted(cases.items()):
              status = c[0].tag if len(c) else "passed"
              print(f"  {status:8} {name}")
              if (status != "skipped") if name in SKIP_OK else (status != "passed"):
                  bad.append((name, status))
          assert len(cases[MUST]) == 0, "NOT ENFORCED aniqlanishi PG18 da BAJARILMADI"
          assert not bad, bad
          print(f"PG18: {len(cases)} testcase, bajarilish isbotlandi")
          PY
      # Phase 5A — 1C Migrator V1: read-only quruq yurish (XID'siz), Numeric aniqligi,
      # 10k sintetik eksport, parallel apply, production system_identifier darvozasi.
      - name: 1C Migrator V1 on PostgreSQL 18
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rfEs -s -k external \
            --junitxml=pytest-pg18-migrator.xml -o junit_family=xunit2 \
            tests/test_migrator_1c_pg.py 2>&1 | tee pytest-pg18-migrator.log
      - name: Verify every migrator PG18 case EXECUTED
        if: always()
        run: |
          python - <<'PY'
          import ast, xml.etree.ElementTree as ET
          src = open("tests/test_migrator_1c_pg.py", encoding="utf-8").read()
          static = sorted(n.name for n in ast.parse(src).body
                          if isinstance(n, ast.FunctionDef) and n.name.startswith("test"))
          cases = {c.get("name"): c for c in ET.parse("pytest-pg18-migrator.xml").getroot().iter("testcase")}
          want = {f"{n}[external]" for n in static}
          assert static, "statik testlar topilmadi"
          assert set(cases) == want, f"migrator PG18 testcase to'plami mos emas: {sorted(set(cases) ^ want)}"
          bad = [(name, c[0].tag) for name, c in sorted(cases.items()) if len(c)]
          for name in sorted(cases):
              print("  passed  " if not len(cases[name]) else f"  {cases[name][0].tag:8}", name)
          assert not bad, bad
          print(f"migrator PG18: {len(cases)} testcase, bajarilish isbotlandi")
          PY
      # Phase 5C — ANIQ (operator yurgizadigan) uuid ustun migratsiyasi: preflight -> apply ->
      # verify -> revert, darvozalar (production sysid, read-only isbot), qulf va yaroqsiz qiymat.
      # Boot endi tipni O'ZI tuzatmaydi — shuning uchun bu alohida, o'z junit'i bilan.
      - name: Explicit uuid schema migration on PostgreSQL 18
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rfEs -k external \
            --junitxml=pytest-pg18-uuidmig.xml -o junit_family=xunit2 \
            tests/test_uuid_migration_pg.py 2>&1 | tee pytest-pg18-uuidmig.log
      - name: Verify every uuid-migration PG18 case EXECUTED
        if: always()
        run: |
          python - <<'PY'
          import ast, xml.etree.ElementTree as ET
          F = "tests/test_uuid_migration_pg.py"
          # ⚠️  PARAMETRLANGAN TESTLAR. Bu fayldagi ba'zi testlar `@parametrize` bilan
          #     keladi, ya'ni junit nomi `test_x[external-<holat>]`. Shuning uchun
          #     taqqoslash ASOS nom bo'yicha: har statik test KAMIDA bir marta, faqat
          #     `external` bazada va FAQAT `passed` holatda bajarilgan bo'lsin.
          static = {n.name: 0 for n in ast.parse(open(F, encoding="utf-8").read()).body
                    if isinstance(n, ast.FunctionDef) and n.name.startswith("test")}
          assert static, "statik testlar topilmadi"
          bad = []
          cases = list(ET.parse("pytest-pg18-uuidmig.xml").getroot().iter("testcase"))
          for c in cases:
              name = c.get("name")
              base, _, params = name.partition("[")
              status = c[0].tag if len(c) else "passed"
              print(f"  {status:8} {name}")
              if "external" not in params.split("]")[0].split("-"):
                  bad.append((name, "external emas"))
              if base not in static:
                  bad.append((name, "statik ro'yxatda yo'q"))
              else:
                  static[base] += 1
              if status != "passed":
                  bad.append((name, status))
          yoq = [n for n, k in static.items() if k == 0]
          assert not yoq, f"BAJARILMAGAN uuid migratsiya testlari: {yoq}"
          assert not bad, bad
          print(f"uuid migratsiya PG18: {len(cases)} testcase / {len(static)} test, bajarilish isbotlandi")
          PY
      # Phase 5B.1 qo'shimchasi: sotuv hujjati ruxsat darajasi, do'kon×filial aktivatsiya darvozasi,
      # yoqish ↔ yozuvchi poygasi, runtime ustunlar tasnifi va uuid tur tuzatishi ham shu yerda.
      # Phase 5B — partiya aktivatsiyasidan oldingi kuchaytirish: vaqt zonasi tasdig'i qulf
      # ostida (parallel yozuvchilar yo'qolmaydi), `/products?tracked=` agregat cheklovi,
      # boot DDL qulflari (barqaror boot DDL yubormaydi, haqiqiy migratsiya cheklangan kutadi).
      # Qulf navbati va `IF NOT EXISTS` ning qulfni nomdan OLDIN olishi — production versiyasida isbotlanadi.
      # Phase 5D — qabul tuzatish poygalari: ikki marta bekor qilish, bekor qilish ↔ sotuv/
      # hisobdan chiqarish/sanoq (ikkala tartibda), konkurrent takror va rad etishning
      # rollback'i. `with_for_update()` SQLite'da no-op — bu poygalarni FAQAT Postgres ko'radi.
      # Phase 5E — tuzatish naqd oyog'ining ledger identity'si: `cle_uq_business` ustun
      # tarkibi, kamayish/oshirish oyoqlari, ikki tuzatishning yonma-yon yashashi, takror
      # IKKINCHI oyoq yozmasligi (qator SONI) va konkurrent yuborish. `cash` sxemasi
      # SQLite'da UMUMAN yo'q — bu tasdiqlarni faqat Postgres ko'radi.
      # Phase 5F — kassa/seyf va `/cash-setup` filial doirasi (rol × filial × do'kon, `cash`
      # sxemasi faqat Postgres'da) hamda chek/chop etish: asl chek noyobligi konkurrent
      # yozuvlarda (`pg_advisory_xact_lock`), logo bytea, filial shabloni noyobligi poygasi.
      - name: Lot pre-activation hardening + boot locks + runtime schema on PostgreSQL 18
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rfEs -k external \
            --junitxml=pytest-pg18-prehardening.xml -o junit_family=xunit2 \
            tests/test_lot_tz_confirm_pg.py tests/test_products_tracked_pg.py \
            tests/test_boot_locks_pg.py tests/test_sales_read_pg.py \
            tests/test_lot_activation_scope_pg.py tests/test_lot_enable_race_pg.py \
            tests/test_runtime_columns_pg.py tests/test_lot_return_pre_activation_pg.py \
            tests/test_receiving_lots_pg.py tests/test_receiving_correction_pg.py \
            tests/test_cash_custody_correction_pg.py \
            tests/test_tills_visibility_pg.py tests/test_receipt_pg.py \
            2>&1 | tee pytest-pg18-prehardening.log
      - name: Verify every pre-hardening PG18 case EXECUTED
        if: always()
        run: |
          python - <<'PY'
          import ast, xml.etree.ElementTree as ET
          FILES = ["tests/test_lot_tz_confirm_pg.py", "tests/test_products_tracked_pg.py",
                   "tests/test_boot_locks_pg.py", "tests/test_sales_read_pg.py",
                   "tests/test_lot_activation_scope_pg.py", "tests/test_lot_enable_race_pg.py",
                   "tests/test_runtime_columns_pg.py",
                   "tests/test_lot_return_pre_activation_pg.py",
                   "tests/test_receiving_lots_pg.py",
                   "tests/test_receiving_correction_pg.py",
                   "tests/test_cash_custody_correction_pg.py",
                   "tests/test_tills_visibility_pg.py",
                   "tests/test_receipt_pg.py"]
          static = {}
          for f in FILES:
              mod = f[:-3].replace("/", ".")
              names = sorted(n.name for n in ast.parse(open(f, encoding="utf-8").read()).body
                             if isinstance(n, ast.FunctionDef) and n.name.startswith("test"))
              assert names, f"{f}: statik testlar topilmadi"
              static.update({(mod, n): 0 for n in names})
          cases = list(ET.parse("pytest-pg18-prehardening.xml").getroot().iter("testcase"))
          bad = []
          for c in cases:
              name, mod = c.get("name"), c.get("classname")
              base, _, params = name.partition("[")
              status = c[0].tag if len(c) else "passed"
              print(f"  {status:8} {mod}::{name}")
              if "external" not in params.split("]")[0].split("-"):
                  bad.append((name, "external emas"))
              if (mod, base) not in static:
                  bad.append((name, "statik ro'yxatda yo'q"))
              else:
                  static[(mod, base)] += 1
              if status != "passed":
                  bad.append((name, status))
          missing = sorted(f"{m}::{n}" for (m, n), k in static.items() if k == 0)
          assert not missing, f"BAJARILMAGAN PG18 testlar: {missing}"
          assert not bad, bad
          print(f"pre-hardening PG18: {len(static)} funksiya, {len(cases)} testcase, bajarilish isbotlandi")
          PY

  prod-install-boundary:
    name: Backend (production install has no tooling packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Matn tekshiruvi (tests/test_dependency_boundary.py) `pip --opt install`, tranzitiv
    # dependency yoki kelajakdagi boshqa yo'lni ko'rmasligi mumkin. Bu job Dockerfile
    # AYNAN qiladigan ishni qiladi — toza venv'ga `pip install .` — va O'RNATILGANINI tekshiradi.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exactly like the Dockerfile (no extras) into a clean venv
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/python -m pip install --upgrade pip -q
          /tmp/prod/bin/python -m pip install ./apps/server -q
      - name: No tooling packages in the production install
        run: |
          /tmp/prod/bin/python - <<'PY'
          import importlib.metadata as md, re
          names = sorted({re.sub(r"[-_.]+", "-", (d.metadata["Name"] or "")).lower()
                          for d in md.distributions()})
          forbidden = {"pandas", "xlrd", "openpyxl", "lxml", "pgserver", "pytest", "ruff"}
          bad = sorted(set(names) & forbidden)
          print(f"{len(names)} paket o'rnatildi; taqiqlanganlar: {bad}")
          assert "savdoos-server" in names, "ilova paketi o'rnatilmadi — tekshiruv ma'nosiz"
          assert not bad, bad
          PY

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm install` (npm ci EMAS): monorepo hoisting sabab app lock-fayllar root
      # bog'liqliklarини (react, @phosphor) o'zida saqlamaydi — ci qat'iy, install esa
      # bardoshли (mahalliy `npm install` dev oqimi bilan bir xil). electron har
      # ilovaning O'Z node_modules'ida, shuning uchun root + har app alohida.
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Install manager deps
        run: npm install --no-audit --no-fund
        working-directory: apps/manager
      - name: Typecheck manager (+ shared)
        run: npx tsc --noEmit
        working-directory: apps/manager
      - name: Install pos deps
        run: npm install --no-audit --no-fund
        working-directory: apps/pos
      - name: Typecheck pos
        run: npx tsc --noEmit
        working-directory: apps/pos

  unit:
    name: Frontend (komponent sinovlari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Run component tests
        run: npm test
      # ⚠️  BAJARILGANINI ISBOTLAYMIZ. "0 sinov topildi" ham exit 0 berishi mumkin
      #     (konfiguratsiya siljisa) va darvoza JIMGINA ochiq qolardi.
      - name: Verify tests actually EXECUTED
        run: |
          npx vitest run --reporter=json --outputFile=vitest.json
          # Diskdagi HAR sinov fayli bajarilib o'tganini, skip yo'qligini va umumiy son pastki
          # chegaradan kam emasligini tekshiradi (include torayishi/fayl ko'chishi jim o'tmasin).
          node scripts/ci/verify_vitest_run.cjs vitest.json 390

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/server
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Install manager deps
        run: npm install --no-audit --no-fund
        working-directory: apps/manager
      - name: Install pos deps
        run: npm install --no-audit --no-fund
        working-directory: apps/pos
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

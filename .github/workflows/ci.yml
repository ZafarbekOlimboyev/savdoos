name: CI

# Har push va PR'da:
#  - backend regressiya testlari (pytest)
#  - frontend tip-tekshiruvi (tsc) — POS va Manager (electron app-ichi node_modules'дан).
#  - E2E (Playwright): robot POS+Manager'ni haqiqiy brauzerda bosib chiqadi
#    (toza SQLite seed + vite dev serverlar — playwright.config.ts webServer'lari).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests
        run: pytest -q

  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm install` (npm ci EMAS): monorepo hoisting sabab app lock-fayllar root
      # bog'liqliklarини (react, @phosphor) o'zida saqlamaydi — ci qat'iy, install esa
      # bardoshли (mahalliy `npm install` dev oqimi bilan bir xil). electron har
      # ilovaning O'Z node_modules'ida, shuning uchun root + har app alohida.
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Install manager deps
        run: npm install --no-audit --no-fund
        working-directory: apps/manager
      - name: Typecheck manager (+ shared)
        run: npx tsc --noEmit
        working-directory: apps/manager
      - name: Install pos deps
        run: npm install --no-audit --no-fund
        working-directory: apps/pos
      - name: Typecheck pos
        run: npx tsc --noEmit
        working-directory: apps/pos

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/server
      - name: Install root deps
        run: npm install --no-audit --no-fund
      - name: Install manager deps
        run: npm install --no-audit --no-fund
        working-directory: apps/manager
      - name: Install pos deps
        run: npm install --no-audit --no-fund
        working-directory: apps/pos
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

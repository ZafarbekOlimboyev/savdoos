name: Staging Deploy (CI-gated)

# ⚠️  BU WORKFLOW ATAYLAB O'CHIQ HOLDA KELADI.
#     `vars.STAGING_DEPLOY_ENABLED == 'true'` bo'lmaguncha job umuman bajarilmaydi.
#     Yoqish tartibi: RELEASE_SAFETY_RUNBOOK.md §2.5 — va u yerdagi TARTIB majburiy:
#     ESKI yo'l o'chiriladi va TASDIQLANADI, keyin yangisi yoqiladi.
#
# ═══ NEGA BU KERAK ══════════════════════════════════════════════════════════
# Railway'ning GitHub trigger'i `checkSuites=false` bilan turganda `main` ga push
# DARHOL staging deploy'ini boshlaydi — CI kutilmaydi. Bu nazariy xavf emas: `main` ga
# 40 ta QIZIL CI run tushgan, shu jumladan 20 tasi KETMA-KET.
#
# `checkSuites=true` ga o'tkazish sinaldi (2026-09-29) va natija YOMON bo'ldi: Railway
# deployment yozuvini UMUMAN yaratmadi — 2 soat 38 daqiqa, hujjatdagi 2 soatlik
# cheklovdan ham keyin. Ya'ni o'sha bayroq bu repoda "CI kutish" emas, "hech qachon
# deploy qilmaslik" degan ma'noni berdi. Bu workflow esa check-suite maydoniga UMUMAN
# tayanmaydi: u faqat `CI` workflow'ining O'Z run'iga qaraydi.
#
# ═══ YOQISHDAN OLDIN (hammasi EGA qo'li bilan, runbook §2.5 tartibida) ══════
#   1. Secret  `RAILWAY_TOKEN`
#   2. ESKI Railway trigger'i O'CHIRILADI va o'chirilgani TASDIQLANADI
#      (`deploymentTriggers` bo'sh qaytishi kerak) — recreate manifesti runbook §2.6 da
#   3. Variable `STAGING_DEPLOY_ENABLED` = `true`
#   Tartib buzilsa ikki deploy yo'li bir vaqtda ochiq qoladi.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: >-
          Deploy qilinadigan ANIQ SHA. `main` ning HOZIRGI tepasi bo'lishi SHART —
          eski SHA bu yo'l bilan deploy QILINMAYDI (qaytarish uchun `deploymentRollback`).
        required: true
        type: string

permissions:
  contents: read
  actions: read

# ═══ KONKURENT DEPLOY ═══════════════════════════════════════════════════════
# Ketma-ket ikki push -> ikki CI -> ikki deploy. CI davomiyligi 9-30 daqiqa orasida
# o'zgaradi, ya'ni ESKI commit'ning CI'si kechroq tugab yangisining ustiga tushishi
# mumkin. `cancel-in-progress: false` — navbat; uzish xavfli bo'lardi, chunki Railway
# mutatsiyasi yuborilgandan keyin job o'ldirilsa deploy baribir davom etadi.
# Navbatning O'ZI yetarli emas — shu bois darvoza "nishon main tepasimi" ni ham
# tekshiradi (`verify_main_ci_green.py`), ya'ni tartibga emas FAKTGA bog'lanadi.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: staging <- CI yashil bo'lgan SHA
    runs-on: ubuntu-latest
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          # Darvoza skripti VA `ci.yml` (kerakli job ro'yxati undan o'qiladi) kerak.
          # `main` ni olamiz: nishon SHA baribir main tepasi bo'lishi shart.
          ref: main

      - name: Deploy qilinadigan SHA ni aniqlash
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then SHA="$MANUAL_SHA"; else SHA="$RUN_SHA"; fi
          # 40 belgili o'n oltilik — boshqa hech narsa qabul qilinmaydi.
          #
          # ⚠️  BU YERDA NUQSON BOR EDI: naqsh `[0-9a-f]` ni sakkiz marta sanab, oxiriga
          #     `*` qo'yardi — ya'ni FAQAT birinchi 8 belgi tekshirilardi, qolgan 32 tasi
          #     ixtiyoriy bo'lardi (jumladan qo'shtirnoq -> GraphQL tanasiga in'ektsiya).
          #     Endi tekshiruv TESKARI: o'n oltilik BO'LMAGAN bitta belgi ham bo'lsa rad.
          #     Qiymat xato xabariga QO'YILMAYDI: jurnal ochiq repoda loginsiz o'qiladi.
          case "$SHA" in
            *[!0-9a-f]* | "") echo "::error::SHA faqat o'n oltilik belgilardan iborat bo'lishi kerak."; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "::error::SHA 40 belgi bo'lishi kerak, olingani ${#SHA}."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy nishoni: $SHA"

      # ═══ DARVOZA ═════════════════════════════════════════════════════════
      # Butun qaror `scripts/ci/verify_main_ci_green.py` da — ATAYLAB YAML'da EMAS.
      # Sabab: YAML ichidagi mantiqni faqat matn bilan tekshirish mumkin, matn testi esa
      # chetlab o'tishni tutmaydi. Skript bo'lsa ijro etiladigan pozitiv VA negativ
      # testlar bilan qoplanadi (`tests/test_ci_gate_script.py`) va mutatsiya bilan
      # o'sha testlarning tishi borligi isbotlanadi.
      #
      # Skript RAD ETADI: `ci-proof/**` dalili · eskirgan SHA (main tepasi emas) ·
      # yiqilgan/bekor qilingan/skipped/tugamagan run · yiqilgan yoki YO'Q kerakli job.
      - name: Darvoza — main-push CI to'liq yashilmi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -Eeuo pipefail
          TIP="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          echo "main tepasi: $TIP"
          # `--paginate`: bitta SHA'da 100 dan ko'p run bo'lishi mumkin (qayta yurgizishlar).
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > runs.json
          RUN="$(python scripts/ci/verify_main_ci_green.py \
                   --sha "$SHA" --main-tip "$TIP" --runs runs.json \
                   --ci-workflow .github/workflows/ci.yml | sed -n 's/^run_id=//p')"
          [ -n "$RUN" ] || { echo "::error::darvoza run id bermadi"; exit 1; }
          gh api --paginate "repos/$REPO/actions/runs/$RUN/jobs?per_page=100" > jobs.json
          python scripts/ci/verify_main_ci_green.py \
            --sha "$SHA" --main-tip "$TIP" --runs runs.json --jobs jobs.json \
            --ci-workflow .github/workflows/ci.yml
          rm -f runs.json jobs.json

      - name: Railway'ga AYNAN shu SHA ni deploy qilish
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          # trustworthy-enchantment · staging · savdoos — QATTIQ yozilgan.
          # Hodisa maydonidan kelgan qiymat muhitni ALMASHTIRA OLMAYDI.
          ENVIRONMENT_ID: 7eb2e84f-3c17-4dbb-b343-2b7a6df783fe
          SERVICE_ID: 4c0164e3-d24f-477d-a3c1-0a4c9283e218
        run: |
          set -Eeuo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo "::error::RAILWAY_TOKEN secret yo'q."; exit 1; }

          # So'rov tanasi ALOHIDA faylga: `-d @fayl` buyruq satrida ham, jarayonlar
          # ro'yxatida ham hech narsa ko'rsatmaydi. SHA oldingi qadamda 40 belgili
          # o'n oltilik deb tasdiqlangan, ID'lar konstanta.
          cat > payload.json <<JSON
          {"query":"mutation(\$e:String!,\$s:String!,\$c:String!){ serviceInstanceDeployV2(environmentId:\$e, serviceId:\$s, commitSha:\$c) }",
           "variables":{"e":"$ENVIRONMENT_ID","s":"$SERVICE_ID","c":"$SHA"}}
          JSON

          curl -sS --fail-with-body \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: savdoos-ci-gated-deploy" \
            -X POST https://backboard.railway.com/graphql/v2 \
            -d @payload.json > resp.json
          rm -f payload.json

          python - <<'PY'
          import json, sys
          d = json.load(open('resp.json', encoding='utf-8'))
          if d.get('errors'):
              sys.exit('::error::Railway rad etdi: %s' % json.dumps(d['errors'])[:400])
          print('deploy boshlandi:', json.dumps(d.get('data'))[:200])
          PY
          rm -f resp.json

name: Staging Deploy (CI-gated)

# ⚠️  BU WORKFLOW ATAYLAB O'CHIQ HOLDA KELADI.
#     `vars.STAGING_DEPLOY_ENABLED == 'true'` bo'lmaguncha hech narsa qilmaydi.
#     Yoqish — EGA qaroriga bog'liq, aktivatsiya rejasi: RELEASE_SAFETY_RUNBOOK.md §2.
#
# ═══ NEGA BU KERAK ══════════════════════════════════════════════════════════
# TARIXIY holat (2026-09-28): Railway'ning GitHub trigger'i `checkSuites=false` bilan
# turardi, ya'ni
# `main` ga push DARHOL staging deploy'ini boshlardi — CI kutilmaydi. Bu nazariy xavf emas:
# `main` ga 40 ta QIZIL CI run tushgan (2026-08-26..2026-09-13), shu jumladan 20 tasi
# KETMA-KET (75d48cd..68f73ae). Har biri tekshirilmagan staging deploy'ini boshlagan.
#
# JORIY holat (2026-09-30 da o'lchangan): trigger `checkSuites=true` bilan turadi va
# u uchidan-uchiga ISHLAYDI — probe push'i `WAITING` -> CI 8/8 -> `SUCCESS` zanjirini
# ko'rsatdi (RELEASE_SAFETY_RUNBOOK.md §2.7). Bu workflow esa hamon O'CHIQ.
#
# ═══ NEGA RAILWAY'NING "Wait for CI" BAYROG'I O'ZI YETARLI EMAS ═════════════
# `checkSuites=true` commit SHA'siga biriktirilgan HAR BIR GitHub Actions check suite'ini
# kutadi va HAR BIR workflow run'ining XULOSASINI baholaydi. Bu repoda esa bitta SHA'ga
# ko'p suite biriktiriladi (2026-09-28 da o'lchandi):
#     d916b9b -> 8 suite  (3 ta github-actions + 5 ta begona ilova)
#     25a55fb -> 12 suite (7 ta github-actions + 5 ta begona ilova)
# Begona ilovalar (netlify, zeet-co, vercel, render, railway-app) DOIMIY `queued` holatda,
# 0 ta run bilan — Railway hujjati bo'yicha ular E'TIBORSIZ qoldiriladi.
# LEKIN `github-actions` suite'lari orasida CI'dan tashqari JADVALLI workflow'lar ham bor:
# `Uptime` (har 15 daqiqa), `DB Backup` (har tun), `Restore Rehearsal` (har hafta) —
# ular DEFAULT BRANCH HEAD'iga bog'lanadi, ya'ni AYNAN deploy qilinayotgan SHA'ga.
# Natija: production'ning health blip'i yoki tungi backup'ning yiqilishi STAGING deploy'ini
# to'xtatadi. Yo'nalish xavfsiz (deploy BO'LMAYDI), lekin bog'lanish noto'g'ri.
#
# Bu workflow esa FAQAT `CI` ning xulosasiga qaraydi va AYNAN CI sinagan SHA'ni deploy qiladi.
#
# ═══ YOQISHDAN OLDIN ════════════════════════════════════════════════════════
# Tartib BU YERDA TAKRORLANMAYDI. Yagona normativ ketma-ketlik —
# RELEASE_SAFETY_RUNBOOK.md §2.5 jadvali. Qoidasi bitta:
#
#     AVVAL eski yo'l o'chiriladi → o'chgani TEKSHIRILADI → KEYIN yangisi yoqiladi.
#
# ⚠️  Ilgari shu yerda teskari tartib yozilgan edi (variable → keyin trigger) va
#     `checkSuites=true` trigger'ni o'chirishga TENG variant sifatida taklif qilinardi.
#     Ular teng EMAS: `checkSuites=true` da Railway'ning o'z yo'li TIRIK qoladi va bu
#     workflow yoqilganda ikkalasi bir vaqtda deploy qiladi.
#
# ⚠️  `RAILWAY_TOKEN` repo darajasidagi secret BO'LMASIN. U `staging` nomli GitHub
#     Environment'iga qo'yiladi va o'sha Environment'ning *deployment branch policy*
#     si FAQAT `main` ga cheklanadi. Sababi quyidagi qadamda tushuntirilgan.
#
# ⚠️  Bu "o'z deploy tizimimiz" EMAS: ishni Railway'ning O'Z `serviceInstanceDeployV2`
#     mutatsiyasi bajaradi. Bu yerda faqat DARVOZA bor.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Deploy qilinadigan ANIQ SHA (bo'sh qoldirilsa — rad etiladi)."
        required: true
        type: string

permissions:
  contents: read
  actions: read

# ═══ KONKURENT DEPLOY ═══════════════════════════════════════════════════════
# Ketma-ket ikki push -> ikki CI -> ikki deploy. Ular parallel ketsa Railway'ga
# ikki mutatsiya bir vaqtda boradi va OXIRGI TUGAGANI yutadi — bu esa eng yangi
# commit bo'lishi SHART EMAS (CI davomiyligi 9-30 daqiqa orasida o'zgaradi, ya'ni
# eski commit'ning CI'si kechroq tugashi mumkin).
#
# `cancel-in-progress: false` — navbat: deploy'lar birin-ketin bajariladi, hech biri
# yarim yo'lda uzilmaydi. Uzish xavfli bo'lardi: Railway mutatsiyasi yuborilgandan
# keyin job o'ldirilsa, deploy baribir davom etadi, lekin biz natijani ko'rmaymiz.
#
# ⚠️  Navbatning O'ZI yetarli emas — tartib baribir CI tugash vaqtiga bog'liq.
#     Shu bois quyida "nishon hali ham main tepasimi" tekshiruvi bor: eskirgan
#     deploy JIMGINA o'tkazib yuboriladi.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: staging <- CI yashil bo'lgan SHA
    runs-on: ubuntu-latest
    # ⚠️  DARVOZANI FAYL ICHIDAN HIMOYA QILIB BO'LMAYDI.
    #     `workflow_dispatch` workflow TA'RIFINI chaqiruvchi ko'rsatgan ref'dan oladi
    #     (`gh workflow run ... --ref <ref>`). Ya'ni quyidagi hamma tekshiruvlar —
    #     freshness ham, CI-yashillik ham — chaqiruvchi tanlagan nusxadan ishlaydi.
    #     Repoda tuzatilmagan eski nusxali ref'lar allaqachon bor va yangisini yaratish
    #     ham oson. Demak yagona ishonchli chegara — sirni FAYLDAN TASHQARIDA cheklash.
    #
    #     `environment:` aynan shuni beradi: GitHub sirni faqat *deployment branch policy*
    #     ga mos ref'dagi run'ga beradi. `staging` muhitida policy `main` ga cheklansa,
    #     boshqa ref'dan dispatch qilingan run `RAILWAY_TOKEN` ni UMUMAN OLMAYDI va
    #     quyidagi `[ -n "$RAILWAY_TOKEN" ]` tekshiruvida fail-closed yiqiladi.
    #
    #     EGA qiladigan ish (RELEASE_SAFETY_RUNBOOK.md §2.5): Settings → Environments →
    #     `staging` → *Deployment branches*: `main` (Selected branches) → `RAILWAY_TOKEN`
    #     ni O'SHA muhitning sirlari sifatida qo'shish (repo sirlaridan olib tashlab).
    environment: staging
    # UCH shart, uchalasi ham majburiy:
    #   · darvoza yoqilgan bo'lsin (ega qarori),
    #   · qo'lda chaqiruv bo'lmasa — CI XULOSASI `success` bo'lsin,
    #   · `workflow_run` hodisasi `main` dan kelgan bo'lsin (`branches:` filtri buni
    #     avtomatik yo'lda cheklaydi).
    #
    # ⚠️  `workflow_dispatch` yo'li bu YERDA main'ga bog'lanmaydi — `if:` da branch
    #     sharti YO'Q va uni shu kontekstda ishonchli yozib ham bo'lmaydi. Vakolat
    #     quyidagi IKKI qadamda beriladi: «Nishon hali ham main tepasimi» (SHA AYNAN
    #     main tepasi bo'lsin) va «CI HAQIQATAN yashilmi» (`main` ga push'dan kelgan
    #     `CI` run tugagan va yashil bo'lsin).
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    steps:
      - name: Deploy qilinadigan SHA ni aniqlash
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="$MANUAL_SHA"
          else
            SHA="$RUN_SHA"
          fi
          # 40 belgili o'n oltilik — boshqa hech narsa qabul qilinmaydi.
          #
          # ⚠️  BU YERDA NUQSON BOR EDI. Ilgari naqsh shunday edi:
          #         [0-9a-f][0-9a-f]...[0-9a-f]*     (sakkizta sinf + `*`)
          #     ya'ni FAQAT birinchi 8 belgi o'n oltilik deb tekshirilardi, qolgan 32 tasi
          #     ixtiyoriy bo'lardi — jumladan QO'SHTIRNOQ. Uzunlik tekshiruvi buni
          #     to'smasdi (in'ektsiya AYNAN 40 belgi bo'lishi mumkin). Natijada
          #     `workflow_dispatch` orqali berilgan qiymat quyidagi heredoc'ga tushib,
          #     JSON tanasini BUZISHI mumkin edi.
          #     Endi tekshiruv TESKARI: o'n oltilik BO'LMAGAN bitta belgi ham bo'lsa — rad.
          #     Qiymat xato xabariga ham QO'YILMAYDI: jurnal ochiq repoda loginsiz o'qiladi.
          case "$SHA" in
            *[!0-9a-f]* | "") echo "::error::SHA faqat o'n oltilik belgilardan iborat bo'lishi kerak."; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "::error::SHA 40 belgi bo'lishi kerak, olingani ${#SHA}."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy nishoni: $SHA"

      # ── 1) Nishon AYNAN `main` tepasi bo'lsinmi ───────────────────────────
      # B4: bu tekshiruv ENDI IKKALA yo'lga ham qo'llanadi.
      #
      # ⚠️  ILGARI NUQSON BOR EDI. Qadamda `if: github.event_name != 'workflow_dispatch'`
      #     turardi, ya'ni qo'lda chaqiruvda qadam O'TKAZIB YUBORILARDI. O'tkazib
      #     yuborilgan qadamning chiqishi BO'SH bo'ladi, deploy qadamining sharti esa
      #     `steps.fresh.outputs.stale != 'true'` — bo'sh qiymat bunga MOS KELADI, ya'ni
      #     shart ROST bo'lib deploy DAVOM ETARDI. Natijada `main` da HECH QACHON
      #     bo'lmagan commit (masalan `ci-proof/**` dagi yashil SHA — CI u yerda ham
      #     ishlaydi, ci.yml `branches: [main, "ci-proof/**"]`) qo'lda staging'ga
      #     chiqarilishi mumkin edi.
      #
      # Eskiroq deploy'ga QAYTISH bu workflow'ning vazifasi EMAS: buning uchun
      # Railway'ning O'Z `deploymentRollback` mexanizmi bor
      # (RELEASE_SAFETY_RUNBOOK.md §5.2 — ILOVANI qaytarish).
      # Shu bois qo'lda chaqiruvda eskirgan SHA — jimgina skip emas, QATTIQ RAD.
      - name: Nishon hali ham main tepasimi
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -Eeuo pipefail
          # ⚠️  `repos/{repo}/commits/main` NOANIQ ref oladi: u SHA, branch yoki TAG
          #     bo'lishi mumkin. `main` nomli tag yaratish push huquqi borga ochiq, va
          #     u holda bu yerda branch emas, tag SHA'si qaytishi mumkin edi. Quyidagi
          #     endpoint AYNAN `refs/heads/main` ni oladi — boshqa hech narsani.
          TIP="$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')"
          echo "main tepasi   : $TIP"
          echo "deploy nishoni: $SHA"
          echo "tip=$TIP" >> "$GITHUB_OUTPUT"
          if [ "$TIP" = "$SHA" ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::Nishon main tepasi EMAS — qo'lda deploy FAQAT main tepasi uchun.           Eskiroq holatga qaytish Railway'ning o'z rollback mexanizmi bilan qilinadi."
            exit 1
          fi
          echo "::notice::Nishon eskirgan — main allaqachon $TIP da. Deploy O'TKAZIB YUBORILDI;           yangiroq commit uchun alohida run bajaradi."
          echo "stale=true" >> "$GITHUB_OUTPUT"

      # ── 2a) Darvoza skriptini TASDIQLANGAN SHA dan olish ─────────────────
      # Skript repoda yotadi, ya'ni uni ishlatish uchun checkout kerak. Ref sifatida
      # AYNAN tekshirilgan SHA olinadi: u 40 belgili o'n oltilik deb tasdiqlangan va
      # yuqoridagi qadam uni `main` tepasi bilan tenglashtirgan. Shu bois skript ham,
      # kerakli job ro'yxati o'qiladigan `ci.yml` ham AYNAN deploy qilinayotgan
      # commit'dan keladi — chaqiruvchi tanlagan ixtiyoriy ref'dan emas.
      - name: Darvoza skriptini olish (tasdiqlangan SHA)
        if: steps.fresh.outputs.stale != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false

      # ── 2b) Shu SHA uchun CI HAQIQATAN va TO'LIQ yashilmi ────────────────
      # Mantiq WORKFLOW ICHIDA EMAS, `scripts/ci/verify_main_ci_green.py` da.
      #
      # Nega: YAML ichidagi shartni faqat MATN bilan tekshirish mumkin edi, matn testi
      # esa chetlab o'tishni tutmaydi. Skript sifatida u ijro etiladigan pozitiv/negativ
      # testlar bilan qoplanadi va mutatsiya bilan testlarning tishi borligi isbotlanadi
      # (`apps/server/tests/test_ci_gate_script.py`).
      #
      # IKKI FAZA, chunki job'lar run id'siz olinmaydi:
      #   1) run darajasi -> nomzod run id'lari
      #   2) HAR BIR nomzod run uchun job'lar -> job darajasi
      #
      # ⚠️  Job darajasi ATAYLAB har bir nomzod run uchun tekshiriladi. Shartli qilib
      #     o'chirilgan («skipped») majburiy job run xulosasini `success` qoldiradi —
      #     ya'ni faqat run darajasiga qarash darvozani ochiq qoldirardi.
      - name: Bu SHA uchun CI HAQIQATAN yashilmi
        if: steps.fresh.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
          TIP: ${{ steps.fresh.outputs.tip }}
        run: |
          set -Eeuo pipefail

          # Sahifalash: `--paginate` barcha sahifalarni ketma-ket yozadi; skript
          # ularni birlashtirib o'qiydi. Ilgari bitta sahifa o'qilardi va `Uptime`
          # kuniga ~96 run qo'shgani uchun dalil jimgina yo'qolardi.
          gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > runs.json

          # 1-faza: run darajasi + nomzod id'lar
          OUT="$(python3 scripts/ci/verify_main_ci_green.py \
                   --sha "$SHA" --main-tip "$TIP" --runs runs.json --min-jobs 8)"
          echo "$OUT"
          IDS="$(printf '%s\n' "$OUT" | sed -n 's/^run_ids=//p')"
          [ -n "$IDS" ] || { echo "::error::nomzod run id'lari olinmadi."; exit 1; }

          # 2-faza: har bir nomzod run uchun job dalili
          ARGS=""
          IFS=','
          for RID in $IDS; do
            gh api --paginate "repos/$REPO/actions/runs/$RID/jobs?per_page=100" > "jobs-$RID.json"
            ARGS="$ARGS --jobs jobs-$RID.json"
          done
          unset IFS

          python3 scripts/ci/verify_main_ci_green.py \
            --sha "$SHA" --main-tip "$TIP" --runs runs.json --min-jobs 8 $ARGS

          rm -f runs.json jobs-*.json

      - name: Railway'ga AYNAN shu SHA ni deploy qilish
        if: steps.fresh.outputs.stale != 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          # trustworthy-enchantment · staging · savdoos
          ENVIRONMENT_ID: 7eb2e84f-3c17-4dbb-b343-2b7a6df783fe
          SERVICE_ID: 4c0164e3-d24f-477d-a3c1-0a4c9283e218
        run: |
          set -Eeuo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo "::error::RAILWAY_TOKEN secret yo'q."; exit 1; }

          # So'rov tanasi ALOHIDA faylga yoziladi: `-d @fayl` buyruq satrida ham,
          # jarayonlar ro'yxatida ham hech narsa ko'rsatmaydi. SHA oldingi qadamda
          # 40 belgili o'n oltilik deb tasdiqlangan, ID'lar esa konstanta —
          # shu bois bu yerda qo'shtirnoq ichiga qo'yish xavfsiz.
          cat > payload.json <<JSON
          {"query":"mutation(\$e:String!,\$s:String!,\$c:String!){ serviceInstanceDeployV2(environmentId:\$e, serviceId:\$s, commitSha:\$c) }",
           "variables":{"e":"$ENVIRONMENT_ID","s":"$SERVICE_ID","c":"$SHA"}}
          JSON

          # Railway'ning O'Z mutatsiyasi bajaradi — bu yerda faqat darvoza bor.
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: savdoos-ci-gated-deploy" \
            -X POST https://backboard.railway.com/graphql/v2 \
            -d @payload.json > resp.json
          rm -f payload.json

          python - <<'PY'
          import json, sys
          d = json.load(open('resp.json', encoding='utf-8'))
          if d.get('errors'):
              sys.exit('::error::Railway rad etdi: %s' % json.dumps(d['errors'])[:400])
          print('deploy boshlandi:', json.dumps(d.get('data'))[:200])
          PY
          rm -f resp.json

name: Staging Deploy (CI-gated)

# ⚠️  BU WORKFLOW ATAYLAB O'CHIQ HOLDA KELADI.
#     `vars.STAGING_DEPLOY_ENABLED == 'true'` bo'lmaguncha hech narsa qilmaydi.
#     Yoqish — EGA qaroriga bog'liq, aktivatsiya rejasi: RELEASE_SAFETY_RUNBOOK.md §2.
#
# ═══ NEGA BU KERAK ══════════════════════════════════════════════════════════
# Bugungi holat: Railway'ning GitHub trigger'i `checkSuites=false` bilan turadi, ya'ni
# `main` ga push DARHOL staging deploy'ini boshlaydi — CI kutilmaydi. Bu nazariy xavf emas:
# `main` ga 40 ta QIZIL CI run tushgan (2026-08-26..2026-09-13), shu jumladan 20 tasi
# KETMA-KET (75d48cd..68f73ae). Har biri tekshirilmagan staging deploy'ini boshlagan.
#
# ═══ NEGA RAILWAY'NING "Wait for CI" BAYROG'I O'ZI YETARLI EMAS ═════════════
# `checkSuites=true` commit SHA'siga biriktirilgan HAR BIR GitHub Actions check suite'ini
# kutadi va HAR BIR workflow run'ining XULOSASINI baholaydi. Bu repoda esa bitta SHA'ga
# ko'p suite biriktiriladi (2026-09-28 da o'lchandi):
#     d916b9b -> 8 suite  (3 ta github-actions + 5 ta begona ilova)
#     25a55fb -> 12 suite (7 ta github-actions + 5 ta begona ilova)
# Begona ilovalar (netlify, zeet-co, vercel, render, railway-app) DOIMIY `queued` holatda,
# 0 ta run bilan — Railway hujjati bo'yicha ular E'TIBORSIZ qoldiriladi.
# LEKIN `github-actions` suite'lari orasida CI'dan tashqari JADVALLI workflow'lar ham bor:
# `Uptime` (har 15 daqiqa), `DB Backup` (har tun), `Restore Rehearsal` (har hafta) —
# ular DEFAULT BRANCH HEAD'iga bog'lanadi, ya'ni AYNAN deploy qilinayotgan SHA'ga.
# Natija: production'ning health blip'i yoki tungi backup'ning yiqilishi STAGING deploy'ini
# to'xtatadi. Yo'nalish xavfsiz (deploy BO'LMAYDI), lekin bog'lanish noto'g'ri.
#
# Bu workflow esa FAQAT `CI` ning xulosasiga qaraydi va AYNAN CI sinagan SHA'ni deploy qiladi.
#
# ═══ YOQISHDAN OLDIN (ikkalasi ham EGA qo'li bilan) ═════════════════════════
#   1. Secret  `RAILWAY_TOKEN`  — Railway project/account tokeni.
#   2. Variable `STAGING_DEPLOY_ENABLED` = `true`.
#   3. VA Railway'dagi GitHub trigger'i O'CHIRILADI (`deploymentTriggerDelete`) yoki
#      `checkSuites=true` ga o'tkaziladi. Aks holda IKKI yo'l bir vaqtda deploy qiladi:
#      Railway push bo'yicha, bu workflow esa CI'dan keyin — poyga va ikki baravar deploy.
#
# ⚠️  Bu "o'z deploy tizimimiz" EMAS: ishni Railway'ning O'Z `serviceInstanceDeployV2`
#     mutatsiyasi bajaradi. Bu yerda faqat DARVOZA bor.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Deploy qilinadigan ANIQ SHA (bo'sh qoldirilsa — rad etiladi)."
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: staging <- CI yashil bo'lgan SHA
    runs-on: ubuntu-latest
    # UCH shart, uchalasi ham majburiy:
    #   · darvoza yoqilgan bo'lsin (ega qarori),
    #   · qo'lda chaqiruv bo'lmasa — CI XULOSASI `success` bo'lsin,
    #   · `workflow_run` hodisasi `main` dan kelgan bo'lsin (branches: filtri allaqachon
    #     cheklaydi, lekin `workflow_dispatch` yo'lida ham tekshiriladi).
    if: >-
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Deploy qilinadigan SHA ni aniqlash
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          set -Eeuo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SHA="$MANUAL_SHA"
          else
            SHA="$RUN_SHA"
          fi
          # 40 belgili o'n oltilik — boshqa hech narsa qabul qilinmaydi.
          #
          # ⚠️  BU YERDA NUQSON BOR EDI. Ilgari naqsh shunday edi:
          #         [0-9a-f][0-9a-f]...[0-9a-f]*     (sakkizta sinf + `*`)
          #     ya'ni FAQAT birinchi 8 belgi o'n oltilik deb tekshirilardi, qolgan 32 tasi
          #     ixtiyoriy bo'lardi — jumladan QO'SHTIRNOQ. Uzunlik tekshiruvi buni
          #     to'smasdi (in'ektsiya AYNAN 40 belgi bo'lishi mumkin). Natijada
          #     `workflow_dispatch` orqali berilgan qiymat quyidagi heredoc'ga tushib,
          #     JSON tanasini BUZISHI mumkin edi.
          #     Endi tekshiruv TESKARI: o'n oltilik BO'LMAGAN bitta belgi ham bo'lsa — rad.
          #     Qiymat xato xabariga ham QO'YILMAYDI: jurnal ochiq repoda loginsiz o'qiladi.
          case "$SHA" in
            *[!0-9a-f]* | "") echo "::error::SHA faqat o'n oltilik belgilardan iborat bo'lishi kerak."; exit 1 ;;
          esac
          if [ "${#SHA}" != "40" ]; then
            echo "::error::SHA 40 belgi bo'lishi kerak, olingani ${#SHA}."; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy nishoni: $SHA"

      # Qo'lda chaqirilganda CI'ning yashilligi AVTOMATIK emas — ANIQ tekshiriladi.
      # Aks holda `workflow_dispatch` darvozani chetlab o'tadigan teshik bo'lardi.
      - name: Bu SHA uchun CI HAQIQATAN yashilmi
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" > runs.json
          python - <<'PY'
          import json, os, sys
          runs = json.load(open('runs.json', encoding='utf-8'))['workflow_runs']
          ci = [r for r in runs if r['name'] == 'CI' and r['event'] == 'push']
          if not ci:
              sys.exit("::error::Bu SHA uchun `CI` run TOPILMADI — deploy qilinmaydi.")
          ci.sort(key=lambda r: r.get('run_started_at') or r['created_at'], reverse=True)
          bad = [r for r in ci if r['conclusion'] != 'success']
          for r in ci:
              print("CI run %s branch=%s concl=%s" % (r['id'], r['head_branch'], r['conclusion']))
          if bad:
              sys.exit("::error::Bu SHA uchun %d ta CI run YASHIL EMAS — deploy qilinmaydi."
                       % len(bad))
          print("CI yashil: %d ta run" % len(ci))
          PY
          rm -f runs.json

      - name: Railway'ga AYNAN shu SHA ni deploy qilish
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SHA: ${{ steps.sha.outputs.sha }}
          # trustworthy-enchantment · staging · savdoos
          ENVIRONMENT_ID: 7eb2e84f-3c17-4dbb-b343-2b7a6df783fe
          SERVICE_ID: 4c0164e3-d24f-477d-a3c1-0a4c9283e218
        run: |
          set -Eeuo pipefail
          [ -n "${RAILWAY_TOKEN:-}" ] || { echo "::error::RAILWAY_TOKEN secret yo'q."; exit 1; }

          # So'rov tanasi ALOHIDA faylga yoziladi: `-d @fayl` buyruq satrida ham,
          # jarayonlar ro'yxatida ham hech narsa ko'rsatmaydi. SHA oldingi qadamda
          # 40 belgili o'n oltilik deb tasdiqlangan, ID'lar esa konstanta —
          # shu bois bu yerda qo'shtirnoq ichiga qo'yish xavfsiz.
          cat > payload.json <<JSON
          {"query":"mutation(\$e:String!,\$s:String!,\$c:String!){ serviceInstanceDeployV2(environmentId:\$e, serviceId:\$s, commitSha:\$c) }",
           "variables":{"e":"$ENVIRONMENT_ID","s":"$SERVICE_ID","c":"$SHA"}}
          JSON

          # Railway'ning O'Z mutatsiyasi bajaradi — bu yerda faqat darvoza bor.
          curl -sS --fail-with-body \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: savdoos-ci-gated-deploy" \
            -X POST https://backboard.railway.com/graphql/v2 \
            -d @payload.json > resp.json
          rm -f payload.json

          python - <<'PY'
          import json, sys
          d = json.load(open('resp.json', encoding='utf-8'))
          if d.get('errors'):
              sys.exit('::error::Railway rad etdi: %s' % json.dumps(d['errors'])[:400])
          print('deploy boshlandi:', json.dumps(d.get('data'))[:200])
          PY
          rm -f resp.json

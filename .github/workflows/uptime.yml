name: Uptime

# Har 15 daqiqada prod serverni tekshiradi. Yiqilsa workflow ham yiqiladi —
# GitHub repo egasiga "workflow failed" emailini yuboradi (Settings > Notifications).
#
# NIMA TEKSHIRILADI (va nega o'zgardi):
#   Ilgari faqat /health so'ralardi. U jarayon tirikligini bildiradi va BAZAGA TEGMAYDI —
#   ya'ni Postgres butunlay yiqilganda ham "ok" qaytarardi va monitoring YASHIL turardi,
#   holbuki kassalar savdo qila olmasdi. Endi asosiy tekshiruv /health/ready:
#   baza + cash sxemasi + kritik konfiguratsiya.
#
#   Ikkalasi ham so'raladi, chunki FARQI tashxis beradi:
#     health OK + ready BAD  -> jarayon tirik, LEKIN baza/konfiguratsiya nosoz (restart YORDAM BERMAYDI)
#     health BAD             -> jarayon o'zi javob bermayapti (deploy/restart masalasi)
#
# Eslatma: repo 60 kun harakatsiz qolsa GitHub cron'ni avto-o'chiradi (Actions
# sahifasida "Enable" bosib qayta yoqiladi).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

env:
  BASE: https://savdoos-production.up.railway.app/api/v1

jobs:
  health:
    name: Prod health + readiness
    runs-on: ubuntu-latest
    steps:
      - name: Tiriklik va tayyorlik (3 urinish)
        run: |
          live_code=000; ready_code=000; ready_body=""
          for i in 1 2 3; do
            live_code=$(curl -s -o /tmp/live -w "%{http_code}" --max-time 20 "$BASE/health") || live_code=000
            ready_code=$(curl -s -o /tmp/ready -w "%{http_code}" --max-time 20 "$BASE/health/ready") || ready_code=000
            ready_body=$(cat /tmp/ready 2>/dev/null || true)
            echo "Urinish $i: health=$live_code ready=$ready_code — $ready_body"
            if [ "$ready_code" = "200" ] && echo "$ready_body" | grep -q '"status":"ready"'; then
              echo "Server TAYYOR ✅"; exit 0
            fi
            sleep 20
          done

          # Bu yerga yetdik = tayyor emas. Tashxisni ANIQ ayting.
          if [ "$live_code" = "200" ]; then
            echo "::error::Server JAVOB BERYAPTI, lekin TAYYOR EMAS (ready=$ready_code). \
          Baza yoki konfiguratsiya nosoz — QAYTA ISHGA TUSHIRISH YORDAM BERMAYDI. Javob: $ready_body"
          else
            echo "::error::SavdoOS prod server javob bermayapti (health=$live_code, ready=$ready_code)."
          fi
          exit 1

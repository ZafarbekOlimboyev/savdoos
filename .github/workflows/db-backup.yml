name: DB Backup

# PRODUCTION nusxasi. Butun mantiq `_db-backup-core.yml` da — bu fayl faqat CHAQIRUVCHI.
#
# ⚠️  FAYL NOMI O'ZGARMAYDI. `restore-rehearsal.yml` eng yangi muvaffaqiyatli run'ni
#     `actions/workflows/db-backup.yml/runs` orqali topadi, `PRODUCTION_OPERATIONS_RUNBOOK.md`
#     §3/§4 ham shu nomni ko'rsatadi. Nom o'zgarsa mashq JIMGINA run topolmay qolardi.
#
# ⚠️  ARTEFAKT PREFIKSI `savdoos-db` BO'LIB QOLADI — mashq aynan shu naqshni qidiradi.
#     Staging boshqa prefiks oladi (`savdoos-staging-db`), shu bois mashqning "bitta run'da
#     bitta DB artefakti" invarianti buzilmaydi.
#
# TALAB (repo Settings > Secrets and variables > Actions):
#   PROD_DATABASE_URL — Railway'ning OCHIQ (proxy.rlwy.net) ulanish satri
#   BACKUP_PASSPHRASE — nusxani AES256 bilan shifrlash uchun parol
#
# SAQLASH MUDDATI (GitHub artifact retention, bosqichli):
#   kunlik -> 14 kun · yakshanba -> 56 kun · oyning 1-kuni -> 180 kun
#   ⚠️  Repo OCHIQ bo'lgani uchun GitHub 90 kundan uzunini QISQARTIRADI. 180 kunlik
#       oylik bosqich amalda 90 kun bo'ladi; core workflow buni run oxirida tekshirib
#       ogohlantiradi. Haqiqiy 180 kun kerak bo'lsa — repo YOPIQ qilinishi kerak.
#
# TIKLASHNI SINASH (saqlangan artefaktdan):
#   Actions > Restore Rehearsal > Run workflow > backup_run_id = <shu run id>
#   Batafsil: PRODUCTION_OPERATIONS_RUNBOOK.md

on:
  schedule:
    - cron: "30 22 * * *"   # har kuni 22:30 UTC (Toshkent ~03:30)
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read            # artefaktning haqiqiy `expires_at` ini o'qish uchun

jobs:
  backup:
    uses: ./.github/workflows/_db-backup-core.yml
    with:
      env_label: production
      artifact_prefix: savdoos-db
      retention_daily: 14
      retention_weekly: 56
      retention_monthly: 180
      pg_major: "18"
    secrets:
      database_url: ${{ secrets.PROD_DATABASE_URL }}
      passphrase: ${{ secrets.BACKUP_PASSPHRASE }}

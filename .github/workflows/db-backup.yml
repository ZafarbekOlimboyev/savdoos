name: DB Backup

# Har kuni prod Postgres'dan to'liq nusxa (pg_dump -Fc) + checksum + metadata.
#
# ⚠️  QAT'IY QOIDA: BACKUP OLINMASA — BU WORKFLOW YIQILADI.
# Ilgari `PROD_DATABASE_URL` yo'q bo'lsa `exit 0` qilinardi. Natija: 11 tunlik run "success"
# ko'rindi, LEKIN birorta ham artefakt yaratilmadi — ya'ni backup UMUMAN yo'q edi va buni
# hech narsa aytmadi. Jim yashil = eng xavfli holat. Endi yo'qlik BALAND xato.
#
# TALAB (repo Settings > Secrets and variables > Actions):
#   PROD_DATABASE_URL — to'liq ulanish satri, masalan
#   postgresql://user:parol@sakura.proxy.rlwy.net:11729/railway
#
# SAQLASH MUDDATI (GitHub artifact retention, bosqichli):
#   kunlik       -> 14 kun
#   yakshanba    -> 56 kun  (~8 hafta)
#   oyning 1-kuni-> 180 kun (~6 oy)
#
# SHIFRLASH: artefaktga FAQAT `*.dump.gpg` chiqadi (AES256, `BACKUP_PASSPHRASE` siri bilan).
#   Ochiq dump ish jarayonida o'chiriladi. Parol PAROL MENEJERIDA saqlanadi — u yo'qolsa
#   nusxani ochib bo'lmaydi, ya'ni parol ham backup'ning bir qismidir.
#
# TIKLASH: Actions > DB Backup > run > Artifacts > yuklab oling, keyin
#   gpg --batch --passphrase "<BACKUP_PASSPHRASE>" -o savdoos.dump -d savdoos-<vaqt>.dump.gpg
#   ./scripts/restore_rehearsal.sh savdoos.dump            (BIR MARTALIK bazaga!)
# Batafsil: PRODUCTION_OPERATIONS_RUNBOOK.md

on:
  schedule:
    - cron: "30 22 * * *"   # har kuni 22:30 UTC (Toshkent ~03:30)
  workflow_dispatch: {}

jobs:
  dump:
    name: pg_dump -> artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sirni tekshirish (yo'q bo'lsa YIQILADI)
        env:
          DBURL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "::error::PROD_DATABASE_URL secret o'rnatilmagan — BACKUP OLINMADI."
            echo "Bu ataylab XATO (ilgari jimgina 'success' berardi va backup yo'qligi sezilmasdi)."
            echo "Yoqish: repo Settings > Secrets and variables > Actions > New repository secret"
            echo "  Nomi:  PROD_DATABASE_URL"
            exit 1
          fi
          echo "secret mavjud ✅"

      - name: Saqlash muddatini hisoblash (kunlik/haftalik/oylik)
        id: ret
        run: |
          DOM=$(date -u +%d); DOW=$(date -u +%u)   # DOW: 7 = yakshanba
          if   [ "$DOM" = "01" ]; then DAYS=180; TIER=monthly
          elif [ "$DOW" = "7"  ]; then DAYS=56;  TIER=weekly
          else                         DAYS=14;  TIER=daily
          fi
          echo "days=$DAYS" >> "$GITHUB_OUTPUT"
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"
          echo "Saqlash: $TIER / $DAYS kun"

      - name: PostgreSQL client (17)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' \
            /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Dump + checksum + metadata
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          chmod +x scripts/backup_postgres.sh
          ./scripts/backup_postgres.sh ./backups
          ls -la ./backups

      - name: Shifrlash (majburiy)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        # NEGA MAJBURIY: dump — BUTUN production bazasi (barcha do'konlarning mijozlari,
        # telefonlari, qarzlari, naqd ledgeri). Loyihaning O'Z qoidasi buni taqiqlaydi:
        # apps/server/BACKUPS.md:49 — "Dump fayllar shaxsiy ma'lumot — ochiq (GitHub artifact,
        # umumiy disk) joyga qo'ymang." Repo yopiqligi YETARLI himoya emas: `actions:read`
        # huquqiga ega har qanday token yoki buzilgan CI bog'liqligi artefaktni yuklab oladi.
        # Shu bois artefaktga FAQAT shifrlangan fayl chiqadi; ochiq dump o'chiriladi.
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret o'rnatilmagan — SHIFRLANMAGAN dump yuklanmaydi."
            echo "Yarating: Settings > Secrets and variables > Actions > BACKUP_PASSPHRASE"
            echo "Parolni PAROL MENEJERIDA saqlang — u yo'qolsa nusxani OCHIB BO'LMAYDI."
            exit 1
          fi
          for f in backups/*.dump; do
            gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$f.gpg" "$f"
            rm -f "$f"                      # OCHIQ dump artefaktga CHIQMAYDI
            echo "shifrlandi: $f.gpg ($(wc -c < "$f.gpg") bayt)"
          done
          ls -la ./backups

      - name: Barmoq izi (tiklash qabul testi uchun asos)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        # Bu backup bilan BIR VAQTDA olinadi — keyinchalik tiklash mashqi aynan shu bilan
        # solishtiriladi. Barmoq izisiz "tiklandi" degani "to'liq tiklandi" degani emas.
        run: |
          python -m pip install --upgrade pip -q
          pip install -e apps/server -q
          cd apps/server
          python -m app.tools.db_fingerprint --json > ../../backups/fingerprint.json
          python - <<'PY'
          import json
          d = json.load(open('../../backups/fingerprint.json', encoding='utf-8'))
          c = d['fingerprint']['counts']
          print('companies=%s branches=%s sales=%s' % (c.get('companies'), c.get('branches'), c.get('sales')))
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: savdoos-db-${{ steps.ret.outputs.tier }}-${{ github.run_id }}
          path: |
            backups/*.dump.gpg
            backups/*.sha256
            backups/*.meta.json
            backups/fingerprint.json
          retention-days: ${{ steps.ret.outputs.days }}
          compression-level: 9
          # Fayl topilmasa YIQILSIN — ilgari 'warn' edi va bo'sh backup jimgina o'tib ketardi.
          if-no-files-found: error

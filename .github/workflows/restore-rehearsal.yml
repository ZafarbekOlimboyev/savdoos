name: Restore Rehearsal

# "Backup fayli bor" DEGANI "tiklanadi" DEGANI EMAS.
# Bu workflow buni HAQIQATDA isbotlaydi — har hafta, avtomatik:
#
#   production (FAQAT O'QISH: pg_dump)
#     -> checksum
#     -> BIR MARTALIK postgres service konteyneri (production'ga TEGMAYDI)
#     -> pg_restore --exit-on-error
#     -> FK/sxema butunligi
#     -> barmoq izi solishtiruvi (sanoqlar + ledger summalari)
#
# Mos kelmasa -> RESTORE_REHEARSAL_FAILED va workflow YIQILADI (email keladi).
#
# XAVFSIZLIK: production ustiga HECH QACHON tiklanmaydi. Maqsad — ish jarayoni ichidagi
# vaqtinchalik konteyner; u run tugashi bilan yo'q bo'ladi.

on:
  schedule:
    - cron: "0 3 * * 0"     # har yakshanba 03:00 UTC
  workflow_dispatch: {}

jobs:
  rehearse:
    name: prod dump -> disposable DB -> verify
    runs-on: ubuntu-latest

    services:
      rehearsal-db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: rehearsal-only-ephemeral
          POSTGRES_DB: rehearsal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sirni tekshirish
        env:
          DBURL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$DBURL" ]; then
            echo "::error::PROD_DATABASE_URL yo'q — tiklash mashqi BAJARILMADI."
            exit 1
          fi

      - name: PostgreSQL client (17)
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sed -i 's|deb |deb [signed-by=/usr/share/keyrings/pgdg.gpg] |' \
            /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Install server package
        run: |
          python -m pip install --upgrade pip -q
          pip install -e apps/server -q

      - name: Backup (production — FAQAT O'QISH)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          chmod +x scripts/backup_postgres.sh
          ./scripts/backup_postgres.sh ./backups

      - name: BEFORE barmoq izi (production)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          cd apps/server
          python -m app.tools.db_fingerprint --json > ../../before.json
          echo "before.json olindi"

      - name: Shifrlash + shifrdan chiqarish (haqiqiy tiklash yo'lini sinaydi)
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        # Mashq AYNAN operator bosadigan yo'ldan boradi: artefaktdagi fayl SHIFRLANGAN, ya'ni
        # tiklash shifrdan chiqarishdan boshlanadi. Agar parol noto'g'ri yoki yo'qolgan bo'lsa —
        # nusxa AMALDA YO'Q. Buni falokat kunida emas, HAR HAFTA bilib turish kerak.
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE yo'q — shifrlangan nusxani ochib bo'lmaydi."
            exit 1
          fi
          f=$(ls backups/*.dump | head -1)
          gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASSPHRASE" -o "$f.gpg" "$f"
          rm -f "$f"
          if ! gpg --batch --yes --passphrase "$PASSPHRASE" -o "$f" -d "$f.gpg"; then
            echo "::error::Shifrdan chiqarish YIQILDI — bu nusxa TIKLANMAYDI."
            exit 1
          fi
          echo "shifrdan chiqarildi: $f ($(wc -c < "$f") bayt)"

      - name: Tiklash mashqi (bir martalik bazaga)
        env:
          REHEARSAL_DATABASE_URL: postgresql://postgres:rehearsal-only-ephemeral@localhost:5432/rehearsal
          BEFORE_FINGERPRINT: before.json
          AFTER_FINGERPRINT: after.json
        run: |
          chmod +x scripts/restore_rehearsal.sh
          ./scripts/restore_rehearsal.sh "$(ls backups/*.dump | head -1)"

      - name: Ilova smoke testi (tiklangan baza ustida)
        env:
          DATABASE_URL: postgresql://postgres:rehearsal-only-ephemeral@localhost:5432/rehearsal
          SECRET_KEY: rehearsal-only-not-a-real-secret
          APP_ENV: prod
        # Tiklangan bazada ILOVA ham ko'tarila oladimi — "jadvallar bor" dan kuchliroq dalil.
        run: |
          cd apps/server
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              r = c.get("/api/v1/health/ready")
              print("readyz:", r.status_code, r.json())
              assert r.status_code == 200, "tiklangan bazada readiness YIQILDI"
          print("SMOKE OK")
          PY

      - name: Natijani saqlash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-rehearsal-${{ github.run_id }}
          path: |
            before.json
            after.json
            backups/*.meta.json
          retention-days: 90
          if-no-files-found: warn

name: Staging DB Backup

# STAGING nusxasi. Butun mantiq `_db-backup-core.yml` da — bu fayl faqat CHAQIRUVCHI.
#
# NEGA STAGING'GA HAM NUSXA KERAK (u "faqat demo tenantlar" bo'lsa ham):
#   Staging — MIGRATSIYA MASHQI muhiti. Phase 6A deploy'idan oldin nusxa QO'LDA olingan edi
#   (`railway ssh` + konteynerning PG18 mijozi), chunki avtomatik nusxa UMUMAN yo'q edi:
#   Railway volume backup ro'yxati bo'sh, PITR yo'q, `db-backup.yml` esa faqat production'ni
#   oladi. Ya'ni har bir relizdan oldin operator qo'lda ish qilishga majbur edi — va
#   qo'lda qilinadigan qadam ertami-kechmi tushib qoladi.
#   Qiymati: "oxirgi relizdan OLDINGI holat" ga qaytish. Ma'lumotning o'zi qayta yaratiladi.
#
# SAQLASH MUDDATI — production'dan QISQA, va buning sababi bor:
#   kunlik  ->  7 kun : oxirgi bir necha relizni qoplaydi (reliz haftasiga bir necha marta)
#   haftalik-> 30 kun : bitta reliz siklini qoplaydi
#   oylik   -> 90 kun : GitHub'ning OCHIQ repo uchun MAKSIMUMI; undan uzunini so'rash
#                       jimgina qisqartirilardi, shuning uchun ataylab aynan 90.
#   Production'ning 14/56/180 raqamlari BU YERGA KO'CHIRILMADI: staging'da RPO talabi yo'q
#   (mijoz ma'lumoti yo'q), uzoq saqlash esa faqat joy egallaydi.
#
# TALAB (repo Settings > Secrets and variables > Actions) — EGA QO'LI BILAN:
#   STAGING_DATABASE_URL — staging Postgres'ning OCHIQ (proxy.rlwy.net) ulanish satri.
#                          Railway > trustworthy-enchantment > staging > Postgres-d29B >
#                          Variables dagi TCP proxy ulanish satri.
#   BACKUP_PASSPHRASE    — ALLAQACHON mavjud, production bilan BIR XIL parol ishlatiladi
#                          (ikkinchi parol = ikkinchi yo'qotish xavfi, foydasi yo'q).
#
# ⚠️  Bu workflow `STAGING_DATABASE_URL` yo'q bo'lsa YIQILADI (core'dagi sir tekshiruvi).
#     Bu ATAYLAB: sir qo'shilmaguncha har run qizil bo'ladi va ko'rinib turadi.
#     Jim `exit 0` — aynan production'da 11 tunlik yolg'on "success" bergan nuqson edi.

on:
  schedule:
    # Production 22:30 UTC da. Staging 21:30 — IKKALASI BIR VAQTDA turmasin:
    # bir xil daqiqada ikki run bitta `postgresql-client-18` apt o'rnatishini va
    # ikki Railway proxy ulanishini bir vaqtda talab qilardi. Bir soat oldin —
    # ular aralashmaydi va staging natijasi production boshlanishidan oldin ma'lum bo'ladi.
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  backup:
    # ⚠️  ATAYLAB O'CHIQ HOLDA KELADI — `staging-deploy.yml` bilan AYNAN bir naqsh.
    #     Sababi: bu workflow JADVALLI (har kecha 21:30 UTC). `STAGING_DATABASE_URL`
    #     siri qo'shilmasdan merge qilinsa, u HAR KECHA qizil bo'lardi. Bir necha
    #     kundan keyin qizil jadval "odatiy" bo'lib ko'rinadi va HAQIQIY nosozlik
    #     ham e'tibordan qoladi — bu esa production'da 11 tunlik yolg'on "success"
    #     bergan nuqsonning teskari ko'rinishi.
    #
    #     Yoqish tartibi (ega qo'li bilan, SHU KETMA-KETLIKDA):
    #       1. Secret `STAGING_DATABASE_URL` qo'shiladi.
    #       2. `gh workflow run staging-backup.yml` — qo'lda bir marta, YASHIL bo'lsin.
    #       3. Variable `STAGING_BACKUP_ENABLED=true` — shundan keyin jadval ishlaydi.
    #     Qaytarish: variable'ni `false` qiling; jadval darhol to'xtaydi, sir qoladi.
    #
    #     ⚠️  `secrets` konteksti job'ning `if:` shartida MAVJUD EMAS, shu bois sir
    #         borligini shu yerda tekshirib bo'lmaydi — darvoza ALOHIDA o'zgaruvchida.
    #         Sir bo'lmasa core baribir baland xato beradi (u yerda tekshiruv bor).
    # B3: `workflow_dispatch` darvozadan MUSTASNO. Sababi — runbook §3.6 dagi
    #     yoqish tartibi «avval qo'lda bir marta ishga tushiring, yashil bo'lsin va
    #     artefakt paydo bo'lsin, SO'NGRA variable qo'ying» deydi. Darvoza faqat
    #     variable'ga bog'langanda o'sha qo'lda chaqiruv JIMGINA skip bo'lardi:
    #     artefakt ham, xato ham yo'q — operator «yiqilmadi» ni «ishladi» deb
    #     o'qishi mumkin edi, ya'ni tekshiruv qadami YOLG'ON tasdiq berardi.
    #     Endi qo'lda chaqiruv BAJARILADI, JADVAL esa variable qo'yilmaguncha
    #     o'chiq qoladi. Sir yo'q bo'lsa core baribir FAIL-CLOSED yiqiladi
    #     (`_db-backup-core.yml` — "ulanish satri secret'i o'rnatilmagan").
    # ⚠️  Deploy yo'lidagi bilan AYNI sabab: `workflow_dispatch` job ta'rifini
    #     chaqiruvchi ko'rsatgan REF'dan oladi, ya'ni bu fayldagi hech bir shart
    #     chegara emas. Sir esa bu yerda ham bor (`STAGING_DATABASE_URL`,
    #     `BACKUP_PASSPHRASE`). Yagona tashqi chegara — GitHub Environment va uning
    #     *deployment branch policy* si (EGA qo'yadi; §3.6).
    environment: staging
    if: >-
      vars.STAGING_BACKUP_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_db-backup-core.yml
    with:
      env_label: staging
      # ⚠️  `savdoos-db-` EMAS. `restore-rehearsal.yml` bitta run ichida `savdoos-db-*`
      #     bilan boshlanadigan bir nechta artefakt topsa ATAYLAB yiqiladi; boshqa prefiks
      #     ikki muhitning bir-birini yutmasligini TUZILMAVIY kafolatlaydi.
      artifact_prefix: savdoos-staging-db
      retention_daily: 7
      retention_weekly: 30
      retention_monthly: 90
      pg_major: "18"
    secrets:
      database_url: ${{ secrets.STAGING_DATABASE_URL }}
      passphrase: ${{ secrets.BACKUP_PASSPHRASE }}

name: PostgreSQL client
description: >-
  Installs a PostgreSQL client of the requested major version and pins the binaries
  deterministically (PG_BIN + PATH), bypassing Debian's pg_wrapper.

inputs:
  major:
    description: >-
      Required client major version. Must be >= the production server major
      (production is PostgreSQL 18).
    required: false
    default: "18"

runs:
  using: composite
  steps:
    # ═══ NEGA BU ALOHIDA ACTION ═══════════════════════════════════════════════
    # Birinchi HAQIQIY production backup'i shu sababdan yiqildi:
    #     pg_dump: aborting because of server version mismatch
    #     server version: 18.6 · pg_dump version: 16.15
    # Holbuki `postgresql-client-17` MUVAFFAQIYATLI o'rnatilgan edi (17.11).
    #
    # Sabab: Debian/Ubuntu'da `/usr/bin/pg_dump` haqiqiy binar EMAS — u
    # `/usr/share/postgresql-common/pg_wrapper` ga symlink va qaysi versiyani ishga
    # tushirishni O'ZI hal qiladi. GitHub runner obrazida PostgreSQL 16 oldindan
    # o'rnatilgani uchun wrapper DOIM 16 ni tanlardi. Ya'ni yangi mijozni o'rnatish
    # YETARLI EMAS.
    #
    # Bu qadam ikkala workflow tomonidan ULASHILADI — aks holda biri tuzatilib,
    # ikkinchisi eski versiyada qolib ketardi (backup PG18, restore PG16).
    - name: PGDG repozitoriysi
      shell: bash
      run: |
        sudo install -d /usr/share/keyrings
        curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
        echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] \
        http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
          | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
        sudo apt-get update -qq

    - name: postgresql-client-${{ inputs.major }} o'rnatish
      shell: bash
      run: sudo apt-get install -y -qq "postgresql-client-${{ inputs.major }}"

    - name: Binarlarni ANIQ pin qilish va TASDIQLASH
      shell: bash
      run: |
        MAJOR="${{ inputs.major }}"
        BIN="/usr/lib/postgresql/$MAJOR/bin"

        if [ ! -x "$BIN/pg_dump" ]; then
          echo "::error::$BIN/pg_dump topilmadi — postgresql-client-$MAJOR o'rnatilmadimi?"
          exit 1
        fi

        # TASDIQLASH: pin qilingan binar HAQIQATAN so'ralgan major'mi.
        GOT="$("$BIN/pg_dump" --version | sed -nE 's/.*[^0-9]([0-9]+)(\.[0-9]+)*.*/\1/p' | head -1)"
        if [ "$GOT" != "$MAJOR" ]; then
          echo "::error::$BIN/pg_dump major=$GOT, kutilgani $MAJOR."
          exit 1
        fi

        # PATH'ning OLDIGA — /usr/bin dagi pg_wrapper YUTMASIN.
        echo "$BIN" >> "$GITHUB_PATH"
        # Skriptlar uchun aniq ko'rsatma (scripts/lib/pg_client.sh shuni o'qiydi).
        echo "PG_BIN=$BIN" >> "$GITHUB_ENV"

        echo "pinned: $BIN (major $GOT)"
        echo "wrapper (/usr/bin/pg_dump) uchun taqqoslash:"
        pg_dump --version || true

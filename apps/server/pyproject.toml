[project]
name = "savdoos-server"
version = "0.1.0"
description = "SavdoOS backend — FastAPI + PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "anthropic>=0.40",
  "firebase-admin>=6.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
# pgserver — cash/tenancy testlari uchun SHART. U yo'q bo'lsa `tests/cash/`
# to'liq o'tkazib yuboriladi (37 fayl, ~650 test) va CI 4% qamrov bilan YASHIL
# bo'ladi. Aynan shu sabab tenancy regressiyasi CI dan o'tib production'ga tushdi.
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7", "pgserver>=0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# `tests/cash/` dagi bir nechta modul bir-biridan fixture oladi:
#     from tests.cash.test_retrofit import ...
# Bu `apps/server` ning `sys.path` da bo'lishini talab qiladi. `python -m pytest`
# joriy katalogni O'ZI qo'shadi, yalang'och `pytest` skripti esa QO'SHMAYDI —
# shuning uchun mahalliyda ishlagan to'plam CI'da yig'ilish paytida yiqilardi.
# `pythonpath` buni chaqirish usulidan QAT'IY NAZAR hal qiladi.
pythonpath = ["."]

[tool.ruff]
line-length = 100

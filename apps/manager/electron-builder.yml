appId: uz.savdoos.manager
productName: SavdoOS Manager
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
win:
  target: nsis
  artifactName: SavdoOS-Manager-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: SavdoOS Manager
# Avto-yangilanish manbasi — "owner" ni o'z GitHub foydalanuvchi nomingizga o'zgartiring.
publish:
  provider: github
  owner: OWNER
  repo: savdoos

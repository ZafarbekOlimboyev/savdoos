name: savdoos_mobile
description: BinOS — do'kon egasi uchun mobil yordamchi (analitika + tovar qabul qilish)
publish_to: "none"
version: 1.0.0+68

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino tizim matnlari (sana tanlagich, matn menyusi, «Back»)
  # ilova tilida chiqishi uchun. Qarang `main.dart` -> localizationsDelegates.
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0    # Sozlamalarda haqiqiy versiya (qattiq yozuv o'rniga)
  intl: ^0.20.3
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  mobile_scanner: ^7.4.2
  local_auth: ^2.3.0            # barmoq izi / Face ID (biometrik kirish)
  flutter_secure_storage: ^9.2.2 # PIN xeshi xavfsiz saqlash (Keystore)
  crypto: ^3.0.3               # PIN uchun SHA-256
  # `platform/scanner_web.dart` DOM'ga to'g'ridan-to'g'ri murojaat qiladi (video/canvas
  # host elementi). Paket allaqachon tranzitiv keldi — bu yerda faqat TO'G'RIDAN-TO'G'RI
  # ishlatilayotgani e'lon qilinadi, versiya lock'dagidan o'zgarmaydi.
  web: ^1.1.0
  # CH-17B — Maxfiylik siyosatini tashqi brauzerda ochish (Apple 5.1.1(i):
  # havola ilova ichida OSON TOPILADIGAN joyda bo'lishi shart). Flutter
  # jamoasining rasmiy paketi; iOS/Android amalga oshirishlari TRANZITIV
  # keladi, ularni alohida e'lon qilish SHART EMAS.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # CH-08e — oflayn UI testi (integration_test/ + test_driver/). Flutter SDK
  # ichidagi paket: yuklab olish kerak emas, offline resolution ishlaydi.
  # FAQAT dev_dependency — shipping binary'ga kirmaydi.
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # brend ikonkasini barcha o'lchamlarga yoyish

# `dart run flutter_launcher_icons` — assets/icon/ dan mipmap + adaptive yaratadi
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#011A44"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    # Mobil ruxsat matritsasi (lib/permissions.dart) — backend testi ham o'qiydi.
    - assets/permission_matrix.json
    # Brend belgisi — login ekrani va qobiq uchun (PWA ikonkalari ALOHIDA:
    # ular `web/icons/` da, `scripts/pwa_icons.py` yasaydi).
    - assets/icon/icon.png
  # SHRIFT ILOVA BILAN KELADI. Aks holda Flutter web ishga tushganda Roboto'ni
  # `fonts.gstatic.com` dan YUKLAB OLADI: do'kon ilovasining yuklanish yo'lida
  # uchinchi tomon, yopiq tarmoqda esa matn umuman chiqmasligi mumkin. Fayllar
  # Flutter SDK'ning o'z `material_fonts` keshidan (Apache-2.0), sha256 va
  # baytlar soni `fonts/provenance.json` da pinlangan.
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-Bold.ttf
          weight: 700

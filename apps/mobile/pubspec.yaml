name: savdoos_mobile
description: SavdoOS — do'kon egasi uchun mobil yordamchi (analitika + tovar qabul qilish)
publish_to: "none"
version: 0.6.6+31

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  package_info_plus: ^8.0.0    # Sozlamalarda haqiqiy versiya (qattiq yozuv o'rniga)
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  path_provider: ^2.1.4
  mobile_scanner: ^5.2.3
  local_auth: ^2.3.0            # barmoq izi / Face ID (biometrik kirish)
  flutter_secure_storage: ^9.2.2 # PIN xeshi xavfsiz saqlash (Keystore)
  crypto: ^3.0.3               # PIN uchun SHA-256

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

# SavdoOS — production (server) deploy.
# Bitta buyruq: cd infra && cp .env.prod.example .env && (qiymatlarni to'ldiring) && docker compose -f docker-compose.prod.yml up -d
# Caddy avtomatik HTTPS (Let's Encrypt) oladi — DOMAIN serverning IP'siga yo'naltirilgan bo'lishi kerak.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-savdoos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak (.env)}
      POSTGRES_DB: ${POSTGRES_DB:-savdoos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-savdoos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ../apps/server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-savdoos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-savdoos}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY kerak (.env)}
      CORS_ORIGINS: "*"
      ACCESS_TOKEN_MINUTES: "720"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN kerak (.env)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:

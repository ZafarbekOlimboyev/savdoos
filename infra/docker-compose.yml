services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savdoos
      POSTGRES_PASSWORD: savdoos
      POSTGRES_DB: savdoos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savdoos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  server:
    build: ../apps/server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://savdoos:savdoos@db:5432/savdoos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-me
    ports:
      - "8000:8000"
    profiles: ["full"]   # `docker compose --profile full up` da ishga tushadi

volumes:
  pgdata:
